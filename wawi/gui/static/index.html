      <b>WAWI</b><span id="wawiVersion"></span>

    <div class="navgroup">Workflow</div>
    <a data-page="model"><span class="step">1</span>Model</a>
    <a data-page="env"><span class="step">2</span>Environment</a>
    <a data-page="analysis"><span class="step">3</span>Analysis</a>
    <a data-page="results"><span class="step">4</span>Results</a>

    <span class="muted small" id="drawerToggle">Jobs ▴</span>
  </div>
  <div class="body">
    <div class="joblist" id="jobList"></div>
    <div class="joblog">
      <div class="row"><b id="jobTitle" class="small">Select a job</b><span class="spacer"></span>
        <button class="btn small danger" id="jobCancel" disabled>Cancel job</button>
        <button class="btn small ghost" id="jobClear">Clear finished</button></div>

  </div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
